name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax check all backend files
        run: |
          for f in $(find api -name '*.js'); do
            node --check "$f" || exit 1
          done
          echo "syntax OK"
      - name: Run unit tests
        run: node --test test/*.test.js
