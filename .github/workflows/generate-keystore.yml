name: generate-keystore
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v -keystore keystore/careeros.keystore \
            -alias careeros -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 'CareerOS@2026' -keypass 'CareerOS@2026' \
            -dname "CN=Career OS, OU=Career OS, O=Career OS, L=Dhaka, C=BD"
      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: careeros-keystore
          path: keystore/careeros.keystore
